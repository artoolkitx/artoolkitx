apply plugin: 'com.android.application'

android {
    namespace 'org.artoolkitx.arx.ar2dtracking'
    compileSdk 35
    defaultConfig {
        applicationId "org.artoolkitx.arx.ar2dtracking"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
        }
    }
    sourceSets {
        // Source/etc/android/ is merged in as an extra assets root: its cparam_cache/ subdir
        // lands at assets/cparam_cache/ in the APK, where ARXJ's native code looks for
        // cparam_cache_init.db at runtime.
        main {
            assets.srcDirs += "${rootDir}/../../../../Source/etc/android"
        }
    }
}

/**
 * Link the app to the prebuilt ARXJ AAR shipped under SDK/lib/ARXJ. To develop ARXJ alongside
 * this example instead, see settings.gradle (uncomment the ARXJ project include) and swap the
 * dependency line below for `implementation project(':ARXJ')`.
 */
repositories {
    flatDir {
        dirs "${rootDir}/../../../../SDK/lib/ARXJ"
    }
}

dependencies {
    // Constraint: appcompat 1.7.0 -> lifecycle 2.6.2 -> kotlinx-coroutines 1.6.4 pulls in
    // kotlin-stdlib-jdk7/jdk8:1.6.21, which contain classes that were merged into the main
    // kotlin-stdlib in Kotlin 1.8+. Force the legacy artifacts up to a version where they
    // are empty shells so they no longer clash with kotlin-stdlib:1.8.22.
    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation(name: 'arxj-release', ext: 'aar')
    //implementation project(':ARXJ')
}
